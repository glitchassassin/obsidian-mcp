# Pull-only deployment. Set paths/images with an include env_file or render-truenas.py.
x-service: &service
  restart: unless-stopped
  init: true
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  sync:
    <<: *service
    image: "${OBSIDIAN_MCP_SYNC_IMAGE:-ghcr.io/glitchassassin/obsidian-mcp-sync:latest}"
    environment:
      HOME: /home/node
      XDG_CONFIG_HOME: /home/node/.config
      SYNC_MODE: "${SYNC_MODE:-bidirectional}"
      SYNC_FILE_TYPES: "${SYNC_FILE_TYPES:-image,audio,video,pdf,unsupported}"
      SYNC_EXCLUDED_FOLDERS: "${SYNC_EXCLUDED_FOLDERS:-}"
    volumes:
      - type: bind
        source: "${OBSIDIAN_MCP_DATA_DIR:-/mnt/tank/apps/obsidian-mcp}/vault"
        target: /vault
        bind: {create_host_path: false}
      - type: bind
        source: "${OBSIDIAN_MCP_DATA_DIR:-/mnt/tank/apps/obsidian-mcp}/sync-config"
        target: /home/node/.config
        bind: {create_host_path: false}
    networks: [sync-egress]
    working_dir: /vault
    stop_grace_period: 30s

  desktop-commander:
    <<: *service
    image: "${OBSIDIAN_MCP_COMMANDER_IMAGE:-ghcr.io/glitchassassin/obsidian-mcp-desktop-commander:latest}"
    environment:
      HOME: /home/node
      SHELL: /bin/bash
      DESKTOP_COMMANDER_DISABLE_TELEMETRY: "1"
      SUPERGATEWAY_API_KEY_FILE: /run/secrets/mcp-token
      NODE_ENV: production
    volumes:
      - type: bind
        source: "${OBSIDIAN_MCP_DATA_DIR:-/mnt/tank/apps/obsidian-mcp}/vault"
        target: /vault
        bind: {create_host_path: false}
      - type: bind
        source: "${OBSIDIAN_MCP_DATA_DIR:-/mnt/tank/apps/obsidian-mcp}/commander-state"
        target: /home/node/.claude-server-commander
        bind: {create_host_path: false}
      - type: bind
        source: "${OBSIDIAN_MCP_DATA_DIR:-/mnt/tank/apps/obsidian-mcp}/secrets/mcp-token"
        target: /run/secrets/mcp-token
        read_only: true
        bind: {create_host_path: false}
    working_dir: /vault
    networks:
      origin:
        aliases: [vault-v4.internal]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    read_only: true
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    volumes:
      - type: bind
        source: "${OBSIDIAN_MCP_DATA_DIR:-/mnt/tank/apps/obsidian-mcp}/secrets/tunnel-token"
        target: /run/secrets/tunnel-token
        read_only: true
        bind: {create_host_path: false}
    networks: [origin]
    depends_on:
      desktop-commander: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  origin:
  sync-egress:
