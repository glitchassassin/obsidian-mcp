# Pull-only deployment. Docker creates data and credential volumes automatically.
x-service: &service
  restart: unless-stopped
  init: true
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
x-health: &health
  test: [CMD, node, -e, "fetch('http://127.0.0.1:8001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 5s
  timeout: 5s
  start_period: 15s
  retries: 5

services:
  admin:
    <<: *service
    image: "${OBSIDIAN_MCP_ADMIN_IMAGE:-ghcr.io/glitchassassin/obsidian-mcp-admin:v0.3.0}"
    environment:
      HOME: /home/node
      XDG_CONFIG_HOME: /home/node/.config
      ADMIN_ALLOWED_HOSTS: "${ADMIN_ALLOWED_HOSTS:-}"
    # Trusted LAN only. Never forward this port or add an admin tunnel route.
    ports: ["${ADMIN_BIND_IP:-0.0.0.0}:${ADMIN_PORT:-8090}:8090"]
    volumes:
      - admin-state:/admin-state
      - sync-config:/home/node/.config
      - vault-data:/vault
      - mcp-key:/run/mcp-key
      - tunnel-key:/run/tunnel-key
    networks: [admin-egress]
    healthcheck:
      <<: *health
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  sync:
    <<: *service
    image: "${OBSIDIAN_MCP_SYNC_IMAGE:-ghcr.io/glitchassassin/obsidian-mcp-sync:v0.3.0}"
    environment:
      HOME: /home/node
      XDG_CONFIG_HOME: /home/node/.config
      SYNC_MODE: "${SYNC_MODE:-bidirectional}"
      SYNC_FILE_TYPES: "${SYNC_FILE_TYPES:-image,audio,video,pdf,unsupported}"
      SYNC_EXCLUDED_FOLDERS: "${SYNC_EXCLUDED_FOLDERS:-}"
    volumes:
      - vault-data:/vault
      - sync-config:/home/node/.config
    networks: [sync-egress]
    working_dir: /vault
    stop_grace_period: 30s
    healthcheck: *health

  desktop-commander:
    <<: *service
    image: "${OBSIDIAN_MCP_COMMANDER_IMAGE:-ghcr.io/glitchassassin/obsidian-mcp-desktop-commander:v0.3.0}"
    environment:
      HOME: /home/node
      SHELL: /bin/bash
      DESKTOP_COMMANDER_DISABLE_TELEMETRY: "1"
      SUPERGATEWAY_API_KEY_FILE: /run/mcp-key/token
      NODE_ENV: production
    volumes:
      - vault-data:/vault
      - commander-state:/home/node/.claude-server-commander
      - mcp-key:/run/mcp-key:ro
    working_dir: /vault
    networks:
      origin:
        aliases: [obsidian-mcp.internal]
    stop_grace_period: 30s
    healthcheck: *health

  cloudflared:
    <<: *service
    image: "${OBSIDIAN_MCP_TUNNEL_IMAGE:-ghcr.io/glitchassassin/obsidian-mcp-tunnel:v0.3.0}"
    read_only: true
    volumes: ["tunnel-key:/run/tunnel-key:ro"]
    networks: [origin]
    healthcheck: *health

networks:
  origin:
  sync-egress:
  admin-egress:

volumes:
  vault-data:
  sync-config:
  commander-state:
  admin-state:
  mcp-key:
  tunnel-key:
