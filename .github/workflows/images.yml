name: Build, test, and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      OBSIDIAN_MCP_SYNC_IMAGE: obsidian-mcp-test-sync:${{ github.sha }}
      OBSIDIAN_MCP_COMMANDER_IMAGE: obsidian-mcp-test-commander:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Sync for TrueNAS
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: sync
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.OBSIDIAN_MCP_SYNC_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sync-amd64
          cache-to: type=gha,mode=max,scope=sync-amd64
      - name: Build Desktop Commander for TrueNAS
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: mcp
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ env.OBSIDIAN_MCP_COMMANDER_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=commander-amd64
          cache-to: type=gha,mode=max,scope=commander-amd64
      - name: Test the built images using disposable bind mounts
        run: scripts/ci-test.sh
      - name: Log in to GHCR after tests pass
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested images
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: python3 scripts/publish-images.py
